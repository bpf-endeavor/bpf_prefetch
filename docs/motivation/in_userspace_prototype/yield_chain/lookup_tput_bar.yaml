figsize: [5, 2.5]
x: ['1 flow', '7M flows']
experiments:
  - label: 'Baseline'
    y: [3.4, 2.9]
    color: "tab:orange"
    hatch: "+"
  - label: 'With Prefetch'
    y: [2.8, 2.5]
    color: "tab:green"
    hatch: "//"
yticks: [0, 1.5, 3, 4.5]
grid: true
ylabel: 'Throughput (Mpps)'
legend:
  ncol: 2
output: 'lookup_tput_bar.pdf'
annotate:
  - xy: [-0.05, 3.6]
    text: '3.4'
  - xy: [0.3, 3]
    text: '2.8'
  - xy: [0.95, 3.1]
    text: '2.9'
  - xy: [1.3, 2.7]
    text: '2.5'
comment: "The experiment compares a 3 stage batch processing of packets which
  benefit from prefetching when accessing hash maps to the original model of
  running/accessing maps in eBPF (baseline)"
