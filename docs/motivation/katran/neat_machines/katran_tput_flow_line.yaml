figsize: [2.2,2.1]
subplots:
  - lines:
    - x: [ 1, 100, 10000, 100000, 1000000, 2500000, 5000000, 7000000, 8000000,]
      y: [ 3.28, 3.07, 2.36, 1.57, 1.34, 1.32, 1.25, 1.26, 1.22,]
      color: '#8da0cb'
      marker: 'o'
      markersize: 4
    xlogscale: 10
    ylabel: 'Throughput (Mpps)'
    xticks: [1, 100, 10000, 1000000, 1000000, 100000000]
    xlabel: 'Number of flows'
    yticks: [0, 1, 2, 3, 4]
    annotate_line:
      - xy1: [0, 3.28]
        slope: 0
        linestyle: ':'
        color: 'k'
      - xy1: [0, 1.34]
        slope: 0
        linestyle: ':'
        color: 'k'
      # - xy1: [0, 1.25]
      #   slope: 0
      #   linestyle: ':'
      #   color: 'k'
    arrow:
      - x: 2
        y: 3.28
        dx: 0
        dy: -1.94
        color: k
        head_width: 1.5
        head_length: 0.3
        length_includes_head: true
      # - x: 10000
      #   y: 3.28
      #   dx: 0
      #   dy: -1.25
      #   color: k
      #   head_width: 3000
      #   head_length: 0.3
      #   length_includes_head: true
    annotate:
      - xy: [5, 2.0]
        text: "59%"
        fontsize: 9
      # - xy: [300, 1.8]
      #   text: "61%"
      #   fontsize: 9
output: 'katran_tput.pdf'
