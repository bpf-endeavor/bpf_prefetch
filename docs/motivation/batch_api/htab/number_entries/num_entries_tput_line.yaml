figsize: [5,3]
subplots:
  - lines:
    - label: "Batch + Prefetch"
      x: [1, 1000, 100000, 500000, 1000000, 1500000, 2000000, 2500000, 3000000, 3500000, 4000000, 5000000]
      y: [3420, 3402.22, 3179.56, 2738.33, 2652.78, 2588.0, 2573.67, 2538.67, 2456.44, 2500.0, 2466.78, 2438.11]
      color: 'tab:red'
      linestyle: '-'
      scale: 0.001
      xscale: 0.000001
      marker: 'o'
    - label: 'Batch'
      x: [1, 1000, 100000, 500000, 1000000, 1500000, 2000000, 2500000, 3000000, 3500000, 4000000, 5000000]
      y: [3679.44, 3397.56, 3021.89, 2384.44, 2271.56, 2242.78, 2181.0, 2133.22, 2160.44, 2040.44, 2062.11, 1977.78]
      color: 'tab:blue'
      linestyle: '-.'
      scale: 0.001
      xscale: 0.000001
      marker: 's'
    - label: 'Baseline'
      x: [1, 1000, 100000, 500000, 1000000, 1500000, 2000000, 2500000, 3000000, 3500000, 4000000, 5000000]
      y: [2505.22, 2771.78, 2313.11, 1899.33, 1868.67, 1820.44, 1893.22, 1722.78, 1775.11, 1663.67, 1574.22, 1774.22]
      color: 'k'
      linestyle: ':'
      scale: 0.001
      xscale: 0.000001
      marker: 'x'
    legend:
      loc: "lower center"
      ncol: 3
    ylabel: "Throughput (Mpps)"
    xlabel: "Number of entries (milion)\n(uniform access)"
    yticks: [0, 1.5, 3, 4.5]
    xticks: [0, 2, 4]
    xlim: [-0.1, 4]
    # xlogscale: 10
output: num_entries_trend.pdf

