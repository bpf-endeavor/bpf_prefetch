figsize: [3.0, 2.0]
subplots:
  - lines:
    - label: "Beeswax LPM benchmark"
      x: [1,  8, 16, 32]
      y: [2660549, 2718666, 2845398, 3245311]
      scale: 0.000001
      color: tab:purple
      marker: o
    yticks: [2, 3, 4]
    xticks: [1, 8, 16, 32]
    xtick_labels: ["1 (32)", "8 (4)", "16 (2)", "32 (1)"]
    ylabel: "Throughput (Mpps)"
    xlabel: "Number of lookup stages\n(Progress into trie per lookup)"
    grid: true
    annotate_line:
      - xy1: [0, 2.660549]
        slope: 0
        color: black
        linestyle: ':'
      - xy1: [0, 3.245311]
        slope: 0
        color: black
        linestyle: ':'
    arrow:
      - x: 25
        y: 2.660649
        dx: 0
        dy: 0.6
        length_includes_head: true
        head_width: 1.0
        head_length: 0.2
        facecolor: k
    annotate:
      - xy: [27, 2.8]
        text: "22%"
output: 'lpm_stage_overhead.pdf'
