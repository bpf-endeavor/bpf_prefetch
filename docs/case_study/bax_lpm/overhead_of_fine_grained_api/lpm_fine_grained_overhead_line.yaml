figsize: [3.0, 2.2]
subplots:
  - lines:
    - label: "Beeswax LPM benchmark"
      x: [1,  8, 16, 32]
      y: [3245311, 2845398, 2718666, 2660549]
      scale: 0.000001
      color: tab:purple
      marker: o
    yticks: [2, 3, 4]
    xticks: [1, 8, 16, 32]
    xtick_labels: ["1", "8", "16", "32"]
    ylabel: "Throughput (Mpps)"
    xlabel: "Number of lookup phases"
    grid: true
    annotate_line:
      - xy1: [0, 2.660549]
        slope: 0
        color: black
        linestyle: ':'
      - xy1: [0, 3.245311]
        slope: 0
        color: black
        linestyle: ':'
    arrow:
      - x: 25
        y: 3.245311
        dx: 0
        dy: -0.6
        length_includes_head: true
        head_width: 1.0
        head_length: 0.2
        facecolor: k
      - x: 25.5
        y: 2.0
        dx: 6
        dy: 0
        length_includes_head: true
        head_width: 0.15
        head_length: 1.2
        facecolor: k
    annotate:
      - xy: [26, 2.95]
        text: "-22%"
      - xy: [16.5, 2.05]
        text: "More phases"
        fontsize: 9
output: 'lpm_stage_overhead.pdf'
