figsize: [2.0, 2.1]
x: ['Katran', "Beeswax"]
y: [ [2.090, 0],
     [0, 2.890] ]
     # label: ['Katran', 'Beeswax--', 'Beeswax']
color: ['#8da0cb', '#fc8d62'] # 'papayawhip', 
hatch: ['/', '-', 'x']
bar_width: 0.50
ylabel: 'Throughput (Mpps)'
yticks: [0, 1, 2, 3, 4]
# Annotations
annotate_line:
  - xy1: [0, 2.090]
    slope: 0
    color: black
    linestyle: --
    linewidth: 1
  - xy1: [0, 2.890]
    slope: 0
    color: black
    linestyle: --
    linewidth: 1
report_numbers:
  delta_y: 0.250
  delta_x: -0.200
  round: 1
arrow:
  - x: 0.33
    y: 2.090
    dx: 0
    dy: 0.800
    length_includes_head: true
    head_width: 0.05
    head_length: 0.150
    facecolor: k
annotate:
  - xy: [0.35, 2.200]
    text: '38%'
output: 'katran_server_id_tput.pdf'
grid: true
comments: "
using dpdk-client-server
command: sudo ./build/client_tcp_timestamp -a $NET_PCI --lcores 0@(2,4) -- --client --ip-local 192.168.1.2 --ip-dest 10.10.0.1 --rate 3000000 --payload 128 --duration 200 --zipf-client-addr 1000000/1000/0
cpu: AMD EPYC 7302P 16-Core Processor
  L1d:                       512 KiB (16 instances)
  L1i:                       512 KiB (16 instances)
  L2:                        8 MiB (16 instances)
  L3:                        128 MiB (8 instances)
machines: c6525-25g cloudlab
TCP packet with Katran specific TCP option select uniformly from 1M source addresses
"
