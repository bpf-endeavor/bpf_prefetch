figsize: [2.0, 2.2]
x: ['Baseline', "Beeswax"]
y: [[2.364, 0], [0, 3.297]]
ylabel: 'Throughput (Mpps)'
yticks: [0, 2.5, 5]
  # color: ['tab:gray', 'lime']
color: ['#8da0cb', '#fc8d62']
hatch: ['/' , '-']
grid: true
bar_width: 0.5
annotate:
  - xy: [-0.1, 2.5]
    text: '2.3'
  - xy: [0.9, 3.7]
    text: '3.3'
  # Arrow label
  - xy: [0.33, 2.55]
    text: '39%'
annotate_line:
  - color: black
    xy1: [0, 2.364]
    slope: 0
    linestyle: ":"
  - color: black
    linestyle: ":"
    slope: 0
    xy1: [0, 3.297]
arrow:
  - x: 0.30
    y: 2.365
    dx: 0
    dy: 0.933
    length_includes_head: true
    head_width: 0.05
    head_length: 0.25
output: 'cvm_tput.pdf'

